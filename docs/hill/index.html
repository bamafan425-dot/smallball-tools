  (i<S.length-1?'<button data-n style="'+B+'background:#ffd166;color:#1b1300">Next</button>':'<button data-x style="'+B+'background:#ffd166;color:#1b1300">Done</button>')+'</div>';
 el.querySelectorAll('[data-x]').forEach(function(b){b.onclick=done;});
 var n=el.querySelector('[data-n]');if(n)n.onclick=function(){i++;paint();};
 var bk=el.querySelector('[data-b]');if(bk)bk.onclick=function(){i--;paint();};
}
function open(at){if(el)el.remove();el=document.createElement('div');el.id='hth-tour';
 el.style.cssText='position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:9999;width:min(520px,calc(100vw - 24px));background:#0f1b33;color:#f4ebd9;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 2px #ffd166;padding:16px 18px 14px;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
 document.body.appendChild(el);i=Math.max(0,Math.min(at||0,steps().length-1));paint();}
window.hthTour=open;
var GSX='hth-gs-x';
function addGs(){if(document.getElementById('hth-gs'))return;var st=document.createElement('style');st.textContent='.tabs a[data-t=start]{display:none}#hth-gsw{position:fixed;left:14px;bottom:58px;z-index:9990;display:flex;align-items:center;gap:6px;background:#ffd166;color:#1b1300;border-radius:999px;box-shadow:0 10px 28px rgba(0,0,0,.45);padding:4px 6px 4px 14px;font:800 14px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}#hth-gs{color:#1b1300;text-decoration:none}#hth-gs b{text-decoration:underline}#hth-gsw button{border:0;background:rgba(0,0,0,.12);color:#1b1300;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:13px}@media (max-width:600px){#hth-gsw{font-size:12.5px;bottom:52px}}';document.head.appendChild(st);
 var dis=false;try{dis=!!localStorage.getItem(GSX);}catch(e){}if(dis)return;
 var w=document.createElement('div');w.id='hth-gsw';w.innerHTML='<a id="hth-gs" href="#start">🚀 Need to sign up? <b>Get started here!</b></a><button type="button" title="Hide this (the steps stay at the 🎓 Tour and #start)">✕</button>';
 w.querySelector('button').onclick=function(){w.remove();try{localStorage.setItem(GSX,'1');}catch(e){}};
 w.querySelector('a').onclick=function(){setTimeout(function(){window.scrollTo({top:document.querySelector('.tabs').getBoundingClientRect().top+scrollY-10,behavior:'smooth'});},50);};
 document.body.appendChild(w);}
function addTab(){var nav=document.querySelector('.tabs');if(!nav||nav.querySelector('[data-tour]'))return;var a=document.createElement('a');a.href='#';a.dataset.tour='1';a.textContent='🎓 Tour';a.title='A quick walk through the leaderboard';a.onclick=function(e){e.preventDefault();open(0);};nav.appendChild(a);}
var tries=0,w=setInterval(function(){if(!document.querySelector('.tabs')){if(++tries>60)clearInterval(w);return;}clearInterval(w);addTab();addGs();
 var at=null;try{at=sessionStorage.getItem(AT);}catch(e){}
 var seen=false;try{seen=!!localStorage.getItem(KEY);}catch(e){}
 if(at!==null)open(+at);else if(!seen)setTimeout(function(){open(0);},1200);},250);
})();
</script>
