# Push a tag like v2026.11.25 and this publishes a GitHub Release with everything in downloads/.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" downloads/* --title "SmallBall Tools · $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
